<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registeration Form</title>
</head>
<body>
    <h1> Student Registeration Form </h1>
    <label> Full Name : </label>
    <input type = "Name" placeholder="Enter your name" > <br> <br>
    <label> Email : </label> 
    <input type = "email" placeholder="Enter your email" > <br> <br>
    <label> Password : </label>

    <label> Age : </label>
    <input type = "number" placeholder="Enter your age" > <br> <br>
    <label> Date of Birth : </label>
    <input type = "date" placeholder="dd-mm-yyyy" > <br> <br>
    <label> Gender : </label>
    <input type = "radio" name="Gender" > 
    <label> Female </label>
    <input type = "radio" name="Gender" >  
    <label> Male</label>
    <input type = "radio" name="Gender" > 
    <label> Others</label> <br> <br>
    <label> Department : </label>
    <select> 
        <option> SELECT </option>
        <option> AI DS </option>
        <option> CSE </option>
        <option> IT </option>
    </select> <br> <br>
    <label> Skills : </label>
    <input type = "checkbox" name="Skills" >  
    <label> HTML : </label>
    <input type = "checkbox" name="Skills" >  
    <label> CSS :</label>
    <input type = "checkbox" name="Skills" >  
    <label> JAVASCRIPT :</label> <br> <br> 
    <label> Address :</label> <br>
    <textarea></textarea> <br> <br>
    <button>Submit</button> <br> <br>
    <button>Reset</button> <br> <br>

    <input type="color">
</body>
</html>
